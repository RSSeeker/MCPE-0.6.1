name: Build MCPE 0.6.1

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Fix vcxproj
      shell: powershell
      run: |
        $vcxproj = "handheld\project\win32\Debug\MinecraftWin32.vcxproj"
        $content = [System.IO.File]::ReadAllText($vcxproj)
        $content = $content.Replace('<PlatformToolset>v145</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>')
        $content = $content.Replace('</RootNamespace>', "</RootNamespace>`n    <WindowsTargetPlatformVersion>10.0</WindowsTargetPlatformVersion>")
        $oldLibPath = '..\..\..\lib\lib;$(VCInstallDir)lib;$(VCInstallDir)atlmfc\lib;$(WindowsSdkDir)lib;$(FrameworkSDKDir)\lib'
        $newLibPath = '..\..\..\lib\lib;$(LibraryPath)'
        $content = $content.Replace($oldLibPath, $newLibPath)
        [System.IO.File]::WriteAllText($vcxproj, $content)

    - name: Build Debug
      shell: powershell
      run: |
        msbuild "handheld\project\win32\Debug\MinecraftWin32.vcxproj" /p:Configuration=Debug /p:Platform=Win32 /m /p:WindowsTargetPlatformVersion=10.0

    - name: Build Release
      shell: powershell
      run: |
        msbuild "handheld\project\win32\Debug\MinecraftWin32.vcxproj" /p:Configuration=Release /p:Platform=Win32 /m /p:WindowsTargetPlatformVersion=10.0

    - name: Copy DLLs to Release
      shell: powershell
      run: |
        $releaseDir = "handheld\project\win32\Debug\Release"
        $libBin = "handheld\lib\bin"
        Copy-Item "$libBin\libEGL.dll" $releaseDir -ErrorAction SilentlyContinue
        Copy-Item "$libBin\libgles_cm.dll" $releaseDir -ErrorAction SilentlyContinue
        Copy-Item "$libBin\libpng12.dll" $releaseDir -ErrorAction SilentlyContinue
        Copy-Item "$libBin\zlib1.dll" $releaseDir -ErrorAction SilentlyContinue

    - name: Upload Debug
      uses: actions/upload-artifact@v4
      with:
        name: MinecraftWin32-Debug
        path: |
          handheld\project\win32\Debug\MinecraftWin32.exe
          handheld\project\win32\Debug\*.dll

    - name: Upload Release
      uses: actions/upload-artifact@v4
      with:
        name: MinecraftWin32-Release
        path: |
          handheld\project\win32\Debug\Release\MinecraftWin32.exe
          handheld\project\win32\Debug\Release\*.dll