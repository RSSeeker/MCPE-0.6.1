name: Build MCPE 0.6.1

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Fix vcxproj
      shell: powershell
      run: |
        $vcxproj = "handheld\project\win32\Debug\MinecraftWin32.vcxproj"
        $content = [System.IO.File]::ReadAllText($vcxproj)
        $content = $content.Replace('<PlatformToolset>v145</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>')
        $content = $content.Replace('</RootNamespace>', "</RootNamespace>`n    <WindowsTargetPlatformVersion>10.0</WindowsTargetPlatformVersion>")
        $oldLibPath = '..\..\..\lib\lib;$(VCInstallDir)lib;$(VCInstallDir)atlmfc\lib;$(WindowsSdkDir)lib;$(FrameworkSDKDir)\lib'
        $newLibPath = '..\..\..\lib\lib;$(LibraryPath)'
        $content = $content.Replace($oldLibPath, $newLibPath)
        [System.IO.File]::WriteAllText($vcxproj, $content)

    - name: Pack embedded resources
      shell: powershell
      run: |
        .\tools\pack_resources.ps1

    - name: Build Debug
      shell: powershell
      run: |
        msbuild "handheld\project\win32\Debug\MinecraftWin32.vcxproj" /p:Configuration=Debug /p:Platform=Win32 /m /p:WindowsTargetPlatformVersion=10.0

    - name: Build Release
      shell: powershell
      run: |
        msbuild "handheld\project\win32\Debug\MinecraftWin32.vcxproj" /p:Configuration=Release /p:Platform=Win32 /m /p:WindowsTargetPlatformVersion=10.0

    - name: Copy Data & DLLs
      shell: powershell
      run: |
        $debugDir = "handheld\project\win32\Debug"
        $releaseDir = "handheld\project\win32\Debug\Release"
        $libBin = "handheld\lib\bin"
        $dataSrc = "handheld\data"
        $dataDst = "handheld\project\data"
        # Copy DLLs to Debug
        Copy-Item "$libBin\libEGL.dll" $debugDir -ErrorAction SilentlyContinue
        Copy-Item "$libBin\libgles_cm.dll" $debugDir -ErrorAction SilentlyContinue
        Copy-Item "$libBin\libpng12.dll" $debugDir -ErrorAction SilentlyContinue
        Copy-Item "$libBin\zlib1.dll" $debugDir -ErrorAction SilentlyContinue
        # Copy DLLs to Release
        Copy-Item "$libBin\libEGL.dll" $releaseDir -ErrorAction SilentlyContinue
        Copy-Item "$libBin\libgles_cm.dll" $releaseDir -ErrorAction SilentlyContinue
        Copy-Item "$libBin\libpng12.dll" $releaseDir -ErrorAction SilentlyContinue
        Copy-Item "$libBin\zlib1.dll" $releaseDir -ErrorAction SilentlyContinue
        # Copy game data (exe looks for ../../data/ from handheld/project/win32/Debug/)
        Copy-Item $dataSrc $dataDst -Recurse -Force

    - name: Upload Debug
      uses: actions/upload-artifact@v4
      with:
        name: MinecraftWin32-Debug
        path: |
          handheld\project\win32\Debug\MinecraftWin32.exe
          handheld\project\win32\Debug\*.dll
          handheld\project\data\**

    - name: Upload Release
      uses: actions/upload-artifact@v4
      with:
        name: MinecraftWin32-Release
        path: |
          handheld\project\win32\Debug\Release\MinecraftWin32.exe
          handheld\project\win32\Debug\Release\*.dll
          handheld\project\data\**

    - name: Package
      shell: powershell
      run: |
        $pkg = "package"
        $exeDir = "$pkg\project\win32\Debug"
        $dataDir = "$pkg\project\data"
        $libBin = "handheld\lib\bin"
        New-Item -ItemType Directory -Path $exeDir -Force
        # Copy Debug exe + DLLs
        Copy-Item "handheld\project\win32\Debug\MinecraftWin32.exe" $exeDir
        Copy-Item "handheld\project\win32\Debug\*.dll" $exeDir
        # Copy VLD DLLs for Debug build
        Copy-Item "$libBin\vld_win32\vld_x86.dll" $exeDir -ErrorAction SilentlyContinue
        Copy-Item "$libBin\vld_win32\dbghelp.dll" $exeDir -ErrorAction SilentlyContinue
        # Copy game data
        Copy-Item "handheld\project\data" $dataDir -Recurse -Force
        # Single-file build
        Copy-Item "handheld\project\win32\Debug\Release\MinecraftWin32.exe" "$pkg\MinecraftPE-0.6.1-singlefile.exe"
        Compress-Archive -Path "$pkg\*" -DestinationPath "MinecraftPE-0.6.1-win32.zip"

    - name: Stage single-file executable
      shell: powershell
      run: |
        Copy-Item "handheld\project\win32\Debug\Release\MinecraftWin32.exe" "MinecraftPE-0.6.1.exe" -Force
        Get-Item "MinecraftPE-0.6.1.exe" | Select-Object Name, Length

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: github.event_name != 'pull_request'
      with:
        name: Build #${{ github.run_number }}
        tag_name: build-${{ github.run_number }}
        files: |
          MinecraftPE-0.6.1-win32.zip
          MinecraftPE-0.6.1.exe
        prerelease: true
        generate_release_notes: true
